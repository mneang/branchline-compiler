services:
  - type: web
    name: branchline-compiler-mneang
    runtime: python
    plan: free
    region: oregon
    branch: main
    buildCommand: "python -m pip install --upgrade pip && python -m pip install -r requirements.txt && python -m compileall -q app.py src"
    startCommand: "PYTHONPATH=src:. python app.py"
    healthCheckPath: /
    autoDeployTrigger: off
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.1"
      - key: B2_BUCKET_NAME
        sync: false
      - key: B2_KEY_ID
        sync: false
      - key: B2_APP_KEY
        sync: false
      - key: B2_REGION
        sync: false
      - key: B2_ENDPOINT
        sync: false
      - key: GEN_PROVIDER_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
